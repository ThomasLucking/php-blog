services:
  app:
    build: .
    
    volumes:
      - .:/var/www/html
      - blog-data:/var/www/html/Data
      - blog-uploads:/var/www/html/public/uploads

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80" 
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  blog-data:
  blog-uploads: